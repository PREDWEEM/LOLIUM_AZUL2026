name: Diagnosticar y aplicar adaptación LOLIUM

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  adaptar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/adaptacion-comun-lolium
          fetch-depth: 0

      - name: Validar y descomprimir paquete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = Path('.migration/adaptacion.patch.b64').read_text(encoding='utf-8').strip()
          print('Base64 chars:', len(encoded))
          compressed = base64.b64decode(encoded, validate=True)
          print('Gzip bytes:', len(compressed), hashlib.sha256(compressed).hexdigest())
          patch = gzip.decompress(compressed)
          print('Patch bytes:', len(patch), hashlib.sha256(patch).hexdigest())
          Path('/tmp/adaptacion.patch').write_bytes(patch)
          PY

      - name: Comprobar compatibilidad del parche
        run: git apply --check --verbose /tmp/adaptacion.patch

      - name: Aplicar parche
        run: git apply /tmp/adaptacion.patch

      - name: Compilar
        run: python -m py_compile app_emergenciacombinado_core.py app_emergenciacombinado.py

      - name: Verificar arquitectura común
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app_emergenciacombinado_core.py').read_text(encoding='utf-8')
          assert source.count('def simular_emergencia_local') == 1
          optimizer = source[source.index('def optimizar_parametros_hidricos_2d'):]
          assert 'simular_emergencia_local(' in optimizer
          assert 'rango_ke' not in optimizer
          assert 'rango_cobertura' in optimizer
          assert 'Exponente Kr (secado superficial)' in source
          assert 'idx_pronostico = min(idx_hoy + 7' in source
          assert 'inicio_simulacion' in source and 'total_simulado' in source
          PY
          git diff --check

      - name: Publicar archivos definitivos
        shell: bash
        run: |
          rm -rf .migration
          rm -f .github/workflows/export-lolium-source.yml .github/workflows/retry-adaptacion-comun.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unifica cálculo hídrico y validación Event-to-Event'
          git push origin HEAD:agent/adaptacion-comun-lolium
