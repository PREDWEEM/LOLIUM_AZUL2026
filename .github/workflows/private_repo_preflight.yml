name: Verificar despliegue privado

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar recursos locales
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app_emergenciacombinado.py \
            app_emergenciacombinado_core.py \
            visualizacion_intensidad_relativa.py \
            meteo_daily.csv \
            IW.npy LW.npy bias_IW.npy bias_out.npy \
            modelo_clusters_k3.pkl COPYRIGHT.md; do
            test -f "$file" || { echo "Falta: $file"; exit 1; }
          done

      - name: Verificar independencia de GitHub Raw
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.py' 'raw.githubusercontent.com/PREDWEEM/LOLIUM_AZUL2026' .; then
            echo "Persisten dependencias públicas del propio repositorio."
            exit 1
          fi

      - name: Verificar sintaxis Python
        run: |
          python -m py_compile \
            app_emergenciacombinado.py \
            app_emergenciacombinado_core.py \
            visualizacion_intensidad_relativa.py

      - name: Prueba preliminar de escala relativa 0-100
        run: |
          python - <<'PY'
          from pathlib import Path
          from visualizacion_intensidad_relativa import parchear_visualizacion_intensidad_relativa

          source = Path("app_emergenciacombinado_core.py").read_text(encoding="utf-8")
          patched = parchear_visualizacion_intensidad_relativa(source)
          compile(patched, "app_emergenciacombinado_core.py::patched", "exec")

          assert 'EMERREL_REL_PCT' in patched
          assert 'Campo_Normalizado_PCT' in patched
          assert 'text="Intensidad relativa de emergencia (%)"' in patched
          assert 'range=[0.0, 105.0]' in patched
          assert 'tickvals=[0, 20, 40, 60, 80, 100]' in patched
          assert 'customdata=df[["EMERREL"]].to_numpy()' in patched
          assert 'EMERREL_LOG' not in patched
          assert 'Campo_Normalizado_LOG' not in patched
          assert 'Log10(EMERREL + 0,01)' not in patched

          values = [0.0, 0.05, 0.10, 0.20]
          maximum = max(values)
          pct = [v / maximum * 100.0 for v in values]
          assert pct == [0.0, 25.0, 50.0, 100.0]
          print("OK: Azul usa intensidad relativa de emergencia 0-100 % sin modificar EMERREL")
          PY
